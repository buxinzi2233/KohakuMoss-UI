[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kohakumoss-ui"
version = "1.0.0"
description = "Local web UI for the KohakuMoss trainer, pluggable over its CLI contract"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
native = ["pywebview>=5"]

[project.scripts]
kohakumoss-ui = "kohakumoss_ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kohakumoss_ui" = ["web/*.html", "web/*.css", "web/*.js", "web/themes/*.css", "web/fonts/*.woff2", "web/fonts/*.txt", "web/*/*.js", "web/*/*.css"]
